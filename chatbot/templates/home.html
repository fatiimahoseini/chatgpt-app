{% extends "base.html" %}

{% block content %}

<h2 class="mb-4">Ask LinaAI</h2>

<form id="questionForm" method="POST" action="{% url 'home' %}">
    {% csrf_token %}
    <input type="hidden" name="past_responses" value="{{ past_responses }}">
    
    <div class="mb-3">
        <input type="text" id="questionInput" class="form-control" placeholder="Ask LinaAI a question..." name="question" required>
    </div>
    
    <button type="submit" class="btn btn-primary">Send</button>
</form>

{% if question %}
    <div class="mt-4">
        <h5>Question:</h5>
        <p>{{ question }}</p>
    </div>
{% endif %}

{% if past_responses %}
    <div class="mt-4">
        <h5>LinaAI Responses:</h5>
        <div class="card">
            <div class="card-body">
                {{ past_responses|safe }}
            </div>
        </div>
    </div>
{% endif %}

<script>
    const form = document.getElementById("questionForm");
    const input = document.getElementById("questionInput");

    input.addEventListener("keypress", function(e) {
        if (e.key === "Enter") {
            e.preventDefault();
            form.submit();
            setTimeout(() => {
                input.value = "";
            }, 50);
        }
    });
</script>

{% endblock content %}
